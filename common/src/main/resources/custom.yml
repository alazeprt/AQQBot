# 自定义命令配置文件
# 在QQ中执行该命令时返回指定结果
# 支持掺杂 PlaceholderAPI 所提供的变量

# 例 1
# 返回服务器的 TPS
tps:
  # 是否开启该命令
  enable: true

  # 获取命令
  # 支持 正则表达式 使用 $regex:{你的正则表达式} (可作为参数匹配使用)
  # 支持添加自定义参数, 如 ${argName}, argName可改为自定义的参数名
  # 若是可选参数, 则为 ${argName?:default} default请填写默认值, 如无默认值则请填写 ${argName?}
  # 该参数可在下面的 execute, unbind_execute, output, unbind_output 中使用 如无默认值且用户未使用参数则为空
  command:
    - "/tps"
    - "tps"
    - "/服务器tps"
    - "服务器tps"
    - "TPS"
    - "/TPS"

  # 以后台身份执行命令 (可选) 支持 PAPI
  # 若需要表示玩家的名字, 请使用 $player 作为参数 (会选取第一个绑定的账号)
  # 若不需要执行命令, 请将其设置为空
  # 命令不需要以/开头，会自动补全
  execute:
    - ""

  # 未绑定账号的用户以后台身份执行命令 (可选)
  # 同上
  unbind_execute:
    - ""

  # 若玩家绑定了多个账号, 要选用第几个作为 PlaceholderAPI 的变量解析玩家
  # 若玩家绑定账号小于这个个数, 则默认使用第一个
  choose_account: 1

  # 输出结果
  # 若想随机输出, 你可以在列表添加 $random 代表随机内容分隔符
  # 如: - "第一个随机选项" - "xxx" - "$random" - "第二个随机选项" - "$random" - "第三个随机选项"
  # 代表 随机输出 第一个选项(换行)xxx, 第二个选项, 第三个选项 中的其中一个
  # 你也可以使用 $executes[index] 代表上方特定命令的执行结果 (index 从 1 开始)
  output:
    - "服务器TPS: %spark_tps%"

  # 未绑定账号的玩家输出 (PAPI 变量将会以无身份 (null) 解析)
  # 同上支持随机输出与调用特定命令执行结果
  unbind_output:
    - "服务器TPS: %spark_tps%"

  # 是否格式化颜色符号 (如: &7普通&a玩家 -> 普通玩家)
  format: true

# 例 2
# 返回服务器的 MSPT
mspt:
  enable: true
  command: ["/mspt", "mspt", "/服务器mspt", "服务器mspt", "MSPT", "/MSPT"]
  execute: [""]
  unbind_execute: [""]
  choose_account: 1
  output: ["服务器MSPT: %spark_tickduration%"]
  unbind_output: ["服务器MSPT: %spark_tickduration%"]
  format: true

# 例 3
# 返回服务器的CPU占用率
cpu:
  enable: true
  command: ["/cpu", "cpu", "/cpu占用", "cpu占用", "/cpu占用率", "cpu占用率", "CPU", "/CPU"]
  # 你可以在这里设置执行该命令所需的权限
  # 若不设置, 请留空
  # 该功能需要 LuckPerms 插件
  # * 未绑定用户默认没有权限
  permission: ""
  execute: [""]
  unbind_execute: [""]
  choose_account: 1
  output: ["服务器CPU占用率: %spark_cpu_system%"]
  unbind_output: ["服务器CPU占用率: %spark_cpu_system%"]
  format: true

# 例 4
# 返回服务器的内存占用率
memory:
  enable: false
  command: ["/memory", "/内存占用", "内存占用", "/内存占用率", "内存占用率", "RAM", "/RAM"]
  execute: [""]
  unbind_execute: [""]
  choose_account: 1
  image:
    # 图片路径 (图片均要放在 AQQBot/images 目录下)
    path: "memory.png"

    # 图片元素 (目前仅支持文字)
    elements:
      # 示例元素
      memory:
        type: "text" # 元素类型 (目前仅支持 text 即文字)
        data: "服务器内存占用率: %server_ram_used% / %server_ram_total%"
        x: 50 # 元素所在的x坐标
        y: 50 # 元素所在的y坐标
        size: 24 # 字体大小
        font: "Arial" # 字体名称
        color: "#FFFFFF" # 字体颜色 (RGB 格式)
        bold: false # 是否使用粗体
        italic: false # 是否使用斜体
  unbind_image:
    path: "memory.png"
    elements:
      memory:
        type: "text"
        data: "服务器内存占用率: %server_ram_used% / %server_ram_total%"
        x: 50
        y: 50
        size: 24
        font: "Arial"
        color: "#FFFFFF"
        bold: false
        italic: false

# 例 5
# 仅供测试
test:
  enable: false
  command: ["/test", "test"]
  execute: [""]
  unbind_execute: [""]
  choose_account: 1
  web:
    path: "test"
    width: 1920
    height: 1080
    delay: 1000
    placeholders:
      ee: "测试" # 表示方法: ${ee}
  unbind_web:
    path: "test2"
    width: 1920
    height: 1080
    delay: 1000
    placeholders:
      ee: "测试" # 表示方法: ${eee}